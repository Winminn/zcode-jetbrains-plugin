name: Release to JetBrains Marketplace

on:
  push:
    tags: [ 'v*' ]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webview/package-lock.json

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify tag matches plugin version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          GRADLE_VERSION=$(grep -oP 'version = "\K[^"]+' intellij-plugin/build.gradle.kts)
          echo "tag=$TAG_VERSION gradle=$GRADLE_VERSION"
          if [ "$TAG_VERSION" != "$GRADLE_VERSION" ]; then
            echo "❌ 版本不一致：请先同步 intellij-plugin/build.gradle.kts 的 version，再打 tag v$GRADLE_VERSION" >&2
            exit 1
          fi

      - name: Build webview (multi-file + single-file fallback)
        working-directory: webview
        run: |
          npm ci
          npm run build
          npm run build:single

      - name: Build plugin zip
        run: ./gradlew :intellij-plugin:buildPlugin --console=plain

      - name: Compatibility verification (2024.1 + IU 2026.1)
        run: ./gradlew :intellij-plugin:runPluginVerifier -PpluginVerifierIdeVersions=2024.1,IU-2026.1 --console=plain

      - name: Sign plugin
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew :intellij-plugin:signPlugin --console=plain

      - name: Publish to Marketplace (stable channel)
        env:
          MARKETPLACE_TOKEN: ${{ secrets.MARKETPLACE_TOKEN }}
        run: ./gradlew :intellij-plugin:publishPlugin --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: zc-gui-release
          path: intellij-plugin/build/distributions/ZC-GUI-*.zip
