name: Build & Verify

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webview/package-lock.json

      - uses: gradle/actions/setup-gradle@v4

      - name: Build webview (multi-file + single-file fallback)
        working-directory: webview
        run: |
          npm ci
          npm run build
          npm run build:single

      - name: Build plugin zip
        run: ./gradlew :intellij-plugin:buildPlugin --console=plain

      - name: Quick manifest/structure check
        run: ./gradlew :intellij-plugin:verifyPlugin --console=plain

      - name: Verify zip structure
        run: |
          ZIP=$(ls intellij-plugin/build/distributions/ZC-GUI-*.zip | head -1)
          # gradle-intellij-plugin 产物结构：zip 顶层是 <模块>/ 目录，
          # 主插件 jar 与依赖都放 <模块>/lib/ 下；plugin.xml 与图标在主 jar 内部。
          # 因此先解出主 jar（instrumented-*.jar）再查内部条目。
          unzip -l "$ZIP" | grep -E "lib/.*\.jar" > /dev/null
          MAIN_JAR=$(unzip -Z1 "$ZIP" | grep -E '^[^/]+/lib/instrumented-[^ ]*\.jar$' | head -1)
          test -n "$MAIN_JAR"
          TMPDIR=$(mktemp -d)
          unzip -q "$ZIP" "$MAIN_JAR" -d "$TMPDIR"
          unzip -l "$TMPDIR/$MAIN_JAR" | grep -E "META-INF/plugin\.xml" > /dev/null
          unzip -l "$TMPDIR/$MAIN_JAR" | grep -E "META-INF/pluginIcon.*\.svg" > /dev/null
          rm -rf "$TMPDIR"
          echo "✅ zip 结构完整: $ZIP"

      # 兼容性验证：检查 deprecated/scheduled-for-removal API 与二进制兼容性。
      # 选 2024.1（sinceBuild 下限）+ IU-2026.1（untilBuild 上限）两个代表性版本，
      # 覆盖声明范围的两端；本地要跑全量版本用 ./gradlew :intellij-plugin:runPluginVerifier
      - name: Plugin Verifier (binary compatibility)
        run: ./gradlew :intellij-plugin:runPluginVerifier -PpluginVerifierIdeVersions=2024.1,IU-2026.1 --console=plain
        timeout-minutes: 20

      # verifier 报告归档：HTML 含精确的 deprecated API 调用位置（文件:方法）
      - name: Upload verifier reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verifier-reports
          path: intellij-plugin/build/reports/pluginVerifier/

      - uses: actions/upload-artifact@v4
        with:
          name: zc-gui-plugin
          path: intellij-plugin/build/distributions/ZC-GUI-*.zip
