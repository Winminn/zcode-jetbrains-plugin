# Gradle 配置

# 内存
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# 并行 + 缓存
org.gradle.parallel=true
org.gradle.caching=true

# Kotlin daemon
kotlin.daemon.jvmargs=-Xmx1g

# IntelliJ Plugin 配置（gradle-intellij-plugin）
# 用较新但稳定的 Idea CE 版本
pluginManagerUrl=https://maven.aliyun.com/repository/public/

# 强制走 https（避免 http 重定向问题）
systemProp.https.proxyHost=
