# Gradle 配置

# 内存
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# 并行 + 缓存
org.gradle.parallel=true
org.gradle.caching=true

# Kotlin daemon
kotlin.daemon.jvmargs=-Xmx1g

# IntelliJ Plugin 配置（gradle-intellij-plugin）
# 用较新但稳定的 Idea CE 版本
pluginManagerUrl=https://maven.aliyun.com/repository/public/

# 兼容性验证的目标 IDE 版本列表（runPluginVerifier 逐个验证，逗号分隔）
# 注意：2026 年起 IntelliJ IDEA Community Edition 停更（最新 2025.3），
# 声明上限 2026.3 需用 Ultimate（IU-2026.x）验证覆盖上限。
# CI 里可用 -PpluginVerifierIdeVersions=... 覆盖为代表性版本以缩短时长
pluginVerifierIdeVersions=2024.1,2025.3,IU-2026.1,IU-2026.2

# 强制走 https（避免 http 重定向问题）
systemProp.https.proxyHost=
